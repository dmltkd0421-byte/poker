<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>기억 포커</title><style>
*{box-sizing:border-box}body{background:#101514;color:#eee;font-family:system-ui,sans-serif;margin:auto;max-width:650px;padding:12px;text-align:center}h1{color:#e2bd77;letter-spacing:4px;font-size:24px;margin:10px 0}h2{font-size:18px;margin:8px}button,input,select{font:inherit;padding:10px;border-radius:8px;border:1px solid #82704d;background:#222d28;color:white;min-width:0}button{cursor:pointer;background:#d8b475;color:#171a17;font-weight:bold}button:disabled{opacity:.45}label{display:grid;grid-template-columns:85px 1fr;align-items:center;text-align:left;gap:8px;margin:12px 0}.panel{background:#19231e;border-radius:14px;padding:12px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:min(100%,390px,calc((100dvh - 220px)*.72));margin:10px auto}.card{aspect-ratio: .714;background:#fffdf7;color:#171717;border-radius:6%;position:relative;border:1px solid #c8c5bb;box-shadow:0 2px 4px #0005;container-type:inline-size;overflow:hidden;user-select:none}.red{color:#bd192e}.back{background:repeating-linear-gradient(45deg,#183e52,#183e52 5px,#28556b 5px,#28556b 10px);border:3px solid #e6dfce}.back:after{content:'◆';position:absolute;inset:8%;border:1px solid #d8b475;border-radius:5%;display:grid;place-items:center;color:#d8b475;font-size:30cqw}.selected{outline:3px solid #f5c45f;outline-offset:-2px;transform:scale(.95)}.corner{position:absolute;left:5%;top:3%;font:bold 17cqw/ .9 Georgia,serif;display:flex;flex-direction:column;align-items:center}.corner b{font-size:16cqw}.corner.bottom{left:auto;top:auto;right:5%;bottom:3%;transform:rotate(180deg)}.pip{position:absolute;transform:translate(-50%,-50%);font:23cqw/1 Georgia,serif}.pip.flip{transform:translate(-50%,-50%) rotate(180deg)}.ace{font-size:55cqw}.court{position:absolute;inset:17% 23%;border:1px solid #b49b66;background:#f3e6b9;overflow:hidden}.court svg{width:100%;height:100%}.shared,.hand{display:flex;justify-content:center;gap:6px}.shared .card{width:49px}.hand .card{width:42px}.row{padding:9px;border-bottom:1px solid #35423b;text-align:left;font-size:14px}.room{display:block;width:100%;margin:6px 0}#clock{font-size:24px;color:#e2bd77;font-weight:bold}#msg{color:#e2bd77}.overlay{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:12px;z-index:5}.overlay[hidden],[hidden]{display:none!important}.modal{background:#19231e;border:1px solid #a78a54;border-radius:16px;width:min(100%,480px);max-height:92dvh;overflow:auto;padding:16px}.resultrow{border-bottom:1px solid #35423b;padding:10px 0}.resultrow p{margin:5px;font-size:14px}.count{font-size:100px;color:#e2bd77;font-weight:bold}.muted{color:#a8b5ae;font-size:13px}#actions button{min-width:130px}body{background:#35231c;color:#fff0db;font:16px system-ui;text-align:center;max-width:760px;margin:auto;padding:20px}h1{color:#fff0db;font-size:2em;letter-spacing:normal;margin:.67em 0}a{color:#ffbf79!important}#lobby{background:#493126;border:1px solid #8f6044;border-radius:18px;padding:16px;margin:15px 0}#lobby button,#lobby input,#lobby select{font:inherit;padding:12px;border-radius:9px;border:1px solid #a87550;background:#f0b477;color:#342016;margin:5px}#lobby input:not([type=radio]){background:#fff0dc;width:100%;min-width:0}#lobby label.field{display:grid;grid-template-columns:80px minmax(0,1fr);align-items:center;text-align:left;gap:8px;margin:10px auto;max-width:480px}#lobby .room{width:95%;margin:6px auto}#lobby .round-options{display:flex;flex-wrap:wrap;gap:8px}#lobby .round-choice{display:flex;align-items:center;gap:5px;margin:0;padding:8px;border:1px solid #a87550;border-radius:9px;cursor:pointer}#lobby input[type=radio]{accent-color:#f0b477;width:18px;height:18px;margin:0}#lobby .round-choice:has(input:checked){background:#f0b477;color:#342016}#lobby .create{min-width:150px}</style></head><body><a href="/" style="color:#e2bd77" onclick="leave()">← 게임 선택</a><h1>기억 포커</h1><p>기억력과 포커 전략</p><div id="lobby" class="panel"><label class="field">닉네임:<input id="name" maxlength="20" placeholder="닉네임 입력"></label><label class="field">라운드:<select id="rounds"><option>1</option><option selected>3</option><option>5</option></select></label><button class="create" onclick="create()">방 만들기</button><h3>공개 방 목록</h3><div id="rooms"></div></div><div id="game" hidden><h2 id="phase"></h2><div id="clock"></div><div id="shared" class="shared"></div><div id="grid" class="grid"></div><div id="actions"></div><div id="players" class="panel"></div><button onclick="leave()">대기실로</button></div><div id="overlay" class="overlay" hidden><div id="modal" class="modal"></div></div><p id="msg"></p><script src="/socket.io/socket.io.js"></script><script>
const $=x=>document.getElementById(x),socket=io(),token=sessionStorage.mpToken||(sessionStorage.mpToken=crypto.randomUUID());let state=null,selected=[],review=false;const labels=['하이카드','원페어','투페어','트리플','스트레이트','플러시','풀하우스','포카드','스트레이트 플러시'];const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));$('name').value=localStorage.mpName||'';function name(){let n=$('name').value.trim();if(!n){$('msg').textContent='닉네임을 입력하세요.';return null}localStorage.mpName=n;return n}function create(){let n=name();if(n)socket.emit('create',{name:n,rounds:+$('rounds').value,token})}function leave(){socket.emit('leave');state=null;review=false;$('overlay').hidden=true;$('game').hidden=true;$('lobby').hidden=false}socket.on('connect',()=>socket.emit('resume',token));socket.on('errorMsg',m=>$('msg').textContent=m);socket.on('rooms',rs=>{$('rooms').replaceChildren();if(!rs.length)$('rooms').textContent='참가 가능한 방이 없습니다.';for(let r of rs){let b=document.createElement('button');b.className='room';b.textContent=`${r.name} · ${r.n}/4 · ${r.rounds}R`;b.onclick=()=>{let n=name();if(n)socket.emit('join',{id:r.id,name:n,token})};$('rooms').append(b)}});
function court(v){let crown=v===11?'<path d="M12 14L30 3 48 14 42 23H18Z" fill="#233d70"/>':'<path d="M12 22L8 5 22 15 30 2 38 15 52 5 48 22Z" fill="#e3b343"/>';let figure=`${crown}<ellipse cx="30" cy="31" rx="13" ry="15" fill="#f5d2a0"/><path d="M19 29h5m12 0h5M26 38h8" stroke="#292322" stroke-width="2"/><path d="M5 65L10 49 23 44 30 55 37 44 50 49 55 65Z" fill="#b52b36"/><path d="M12 50L45 65M48 50L15 65" stroke="#d7aa38" stroke-width="7"/><path d="M30 47v18" stroke="#243b68" stroke-width="5"/>`;return `<svg viewBox="0 0 60 130" preserveAspectRatio="none"><g>${figure}</g><g transform="translate(60 130) rotate(180)">${figure}</g></svg>`}function card(c,i=-1){let cls='card '+(!c?'back':['♥','♦'].includes(c.s)?'red':'')+(selected.includes(i)&&i>=0?' selected':'');if(!c)return `<div class="${cls}" onclick="pick(${i})"></div>`;let v=({11:'J',12:'Q',13:'K',14:'A'}[c.v]||c.v),corner=`${v}<b>${c.s}</b>`,pips=[];if(c.v===14)pips=[[50,50]];else if(c.v<=10){let n=c.v;if(n<=3){pips=[[50,23],[50,77]];if(n===3)pips.push([50,50])}else{let ys=n<=5?[23,77]:n<=8?[23,50,77]:[23,41,59,77];for(let y of ys)for(let x of [30,70])pips.push([x,y]);if(n===5||n===9)pips.push([50,50]);if(n===7||n===8||n===10)pips.push([50,n===10?32:36]);if(n===8||n===10)pips.push([50,n===10?68:64])}}let middle=c.v>=11&&c.v<=13?`<div class="court">${court(c.v)}</div>`:pips.map(([x,y])=>`<span class="pip ${y>50?'flip':''} ${c.v===14?'ace':''}" style="left:${x}%;top:${y}%">${c.s}</span>`).join('');return `<div class="${cls}" onclick="pick(${i})"><span class="corner">${corner}</span>${middle}<span class="corner bottom">${corner}</span></div>`}
function pick(i){if(!state||state.phase!=='choose'||state.pick.length===2||i<0)return;if(selected.includes(i))selected=selected.filter(x=>x!==i);else if(selected.length<2)selected.push(i);render()}socket.on('state',s=>{if(!state||state.phase!==s.phase||state.round!==s.round){selected=[];review=false}state=s;if(s.pick.length===2)selected=s.pick;render()});function title(p){return p.rank?(p.rank[0]===8&&p.rank[1]===14?'로열 스트레이트 플러시':labels[p.rank[0]]):'미완료'}function ready(){socket.emit('ready')}function render(){let s=state;if(!s)return;$('msg').textContent='';$('lobby').hidden=true;$('game').hidden=false;let me=s.players.find(p=>p.id===s.me),result=['result','final'].includes(s.phase);$('phase').textContent=`${s.round||1}/${s.rounds} 라운드 · `+({wait:'준비',countdown:'곧 시작합니다',memory:'카드를 기억하세요',choose:'카드 2장 선택',result:'라운드 결과',final:'최종 결과'}[s.phase]);$('shared').innerHTML=s.shared.map(c=>card(c)).join('');$('grid').innerHTML=Array.from({length:16},(_,i)=>card(s.cards?.[i],i)).join('');$('actions').innerHTML=s.phase==='wait'?`<button onclick="ready()">${me.ready?'준비 취소':'준비 완료'}</button>`:s.phase==='choose'?`<button ${selected.length!==2||me.done?'disabled':''} onclick="socket.emit('pick',selected)">${me.done?'선택 완료':'선택 확정 '+selected.length+'/2'}</button>`:result?'<button onclick="review=false;render()">결과 다시 보기</button>':'';$('players').innerHTML=[...s.players].sort((a,b)=>b.score-a.score).map(p=>`<div class="row"><b>${p.id===s.host?'♛ ':''}${esc(p.name)}</b> ${p.id===s.me?'(나)':''} · ${p.score}점 · ${s.phase==='choose'?(p.done?'선택 완료':'선택 중'):(p.ready?'준비 완료':'대기')} ${p.online?'':'(연결 끊김)'}</div>`).join('');$('overlay').hidden=!(s.phase==='countdown'||(result&&!review));if(s.phase==='countdown'){$('modal').innerHTML='<h2>카드 공개까지</h2><div class="count" id="count"></div>';tick()}else if(result){let sorted=[...s.players].sort((a,b)=>s.phase==='final'?b.score-a.score:(a.place||99)-(b.place||99));let winners=sorted.filter(p=>p.score===sorted[0].score).map(p=>esc(p.name)).join(', ');$('modal').innerHTML=`<h2>${s.phase==='final'?'최종 결과':s.round+'라운드 결과'}</h2>${s.phase==='final'?'<h3>우승 · '+winners+'</h3>':''}<div class="muted">공유 카드</div><div class="hand">${s.shared.map(c=>card(c)).join('')}</div>${sorted.map(p=>`<div class="resultrow"><b>${esc(p.name)} ${p.id===s.me?'(나)':''}</b><p>${p.place?p.place+'위 · ':''}${title(p)}</p><div class="hand">${(p.pick||[]).filter(i=>s.cards?.[i]).map(i=>card(s.cards[i])).join('')}</div><p>획득 ${p.earned||0}점 · 누적 ${p.score}점 ${s.phase==='result'?(p.ready?' · 준비 완료':' · 대기'):''}</p></div>`).join('')}<p><button onclick="review=true;render()">전체 카드 복기</button> ${s.phase==='result'?`<button onclick="ready()">${me.ready?'준비 취소':'다음 라운드 준비'}</button>`:'<button onclick="leave()">대기실로</button>'}</p>${s.phase==='result'?`<div class="muted">준비 ${s.players.filter(p=>p.ready).length}/${s.players.length}</div>`:''}`}}
function tick(){let n=state?.end?Math.max(0,Math.ceil((state.end-Date.now())/1000)):0;$('clock').textContent=state?.end?n+'초':'';if($('count'))$('count').textContent=n||'시작'}setInterval(tick,100);
</script></body></html>
