<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>슬리더링크</title><style>*{box-sizing:border-box}body{background:#35231c;color:#fff0db;font:16px system-ui;text-align:center;max-width:760px;margin:auto;padding:20px}a{color:#ffbf79}section{background:#493126;border:1px solid #8f6044;border-radius:18px;padding:16px;margin:15px 0}button,input,select{font:inherit;padding:12px;border-radius:9px;border:1px solid #a87550;background:#f0b477;color:#342016;margin:5px}input{background:#fff0dc;max-width:90%}button{cursor:pointer}button:disabled{opacity:.5}svg{width:min(100%,530px);height:auto;background:#fff;border:1px solid #ddd;border-radius:3px;touch-action:manipulation} [hidden]{display:none!important}.room{display:block;width:95%}#msg{min-height:24px;color:#ffcb91}dialog{background:#493126;color:#fff0db;border:1px solid #e9a15f;border-radius:20px;padding:30px}dialog::backdrop{background:#0009}</style><a href="/">← 게임 선택</a><h1>슬리더링크</h1><p>같은 문제, 가장 빠른 정답이 승리!</p><section id="lobby"><input id="name" maxlength="20" placeholder="닉네임"><select id="size"><option value="5">5 × 5</option><option value="7">7 × 7</option></select><button id="create">방 만들기</button><h3>공개 방 목록</h3><div id="rooms"></div></section><section id="game" hidden><div id="players"></div><h2 id="status"></h2><button id="ready">준비 완료</button><div id="board" hidden><p>선 클릭: 선 → X → 빈칸 / 우클릭: X</p><svg id="grid" viewBox="0 0 400 400"></svg><div><button id="reset">초기화</button></div></div><button id="leave">방 나가기</button></section><p id="msg"></p><details><summary>게임 규칙</summary>숫자만큼 칸의 네 변에 선을 그으세요. 모든 선은 교차하거나 갈라지지 않는 하나의 닫힌 고리가 되어야 합니다. 모든 조건을 충족하면 자동으로 정답이 판정되며 가장 먼저 완성한 사람이 승리합니다.</details><dialog id="result"><h2 id="winner"></h2><p id="elapsed"></p><button id="back">확인</button></dialog><script src="/socket.io/socket.io.js"></script><script>
const $=id=>document.getElementById(id),s=io('/slither');let state,marks=new Map(),built=false;const ns='http://www.w3.org/2000/svg';function el(tag,attrs,parent=$('grid')){let e=document.createElementNS(ns,tag);for(let [k,v] of Object.entries(attrs))e.setAttribute(k,v);parent.append(e);return e}function draw(){let n=state.n,step=350/n,xy=i=>25+i*step,g=$('grid');g.replaceChildren();for(let r=0;r<n;r++)for(let c=0;c<n;c++){if(state.clues[r][c]===null)continue;let t=el('text',{x:xy(c)+step/2,y:xy(r)+step/2+7,'text-anchor':'middle',fill:'#111','font-size':n===5?30:24,'font-weight':700,'pointer-events':'none'});t.textContent=state.clues[r][c]}function edge(k,x,y,x2,y2){let v=marks.get(k)||0;el('line',{x1:x,y1:y,x2,y2,stroke:v===1?'#111':'transparent','stroke-width':v===1?6:1,'stroke-linecap':'round'});if(v===2){let t=el('text',{x:(x+x2)/2,y:(y+y2)/2+5,'text-anchor':'middle',fill:'#b52222','font-size':18});t.textContent='×'}let hit=el('line',{x1:x,y1:y,x2,y2,stroke:'transparent','stroke-width':22,style:'cursor:pointer'});hit.onclick=()=>{if(state.phase!=='play')return;marks.set(k,(v+1)%3);draw();autoCheck()};hit.oncontextmenu=e=>{e.preventDefault();if(state.phase!=='play')return;marks.set(k,v===2?0:2);draw();autoCheck()}}for(let r=0;r<=n;r++)for(let c=0;c<=n;c++){if(c<n)edge(`h${r},${c}`,xy(c),xy(r),xy(c+1),xy(r));if(r<n)edge(`v${r},${c}`,xy(c),xy(r),xy(c),xy(r+1))}for(let r=0;r<=n;r++)for(let c=0;c<=n;c++)el('circle',{cx:xy(c),cy:xy(r),r:n===5?7:5,fill:'#111','pointer-events':'none'})}function leave(){s.emit('leave');state=null;built=false;marks.clear();$('game').hidden=true;$('lobby').hidden=false;$('result').close();$('elapsed').textContent=''}$('create').onclick=()=>s.emit('create',{name:$('name').value,n:$('size').value});$('ready').onclick=()=>s.emit('ready');$('leave').onclick=leave;$('back').onclick=leave;$('reset').onclick=()=>{if(state?.phase!=='play')return;marks.clear();draw();autoCheck()};function autoCheck(){if(state?.phase==='play'&&s.connected)s.emit('check',[...marks].filter(x=>x[1]===1).map(x=>x[0]))} $('result').addEventListener('cancel',e=>e.preventDefault());s.on('rooms',rs=>{$('rooms').replaceChildren();if(!rs.length)$('rooms').textContent='현재 입장 가능한 방이 없습니다.';for(let r of rs){let b=document.createElement('button');b.className='room';b.textContent=`${r.name}의 방 · ${r.n}×${r.n} · ${r.count}/4`;b.onclick=()=>s.emit('join',{id:r.id,name:$('name').value});$('rooms').append(b)}});s.on('state',v=>{state=v;$('lobby').hidden=true;$('game').hidden=false;$('players').textContent=v.players.map(p=>p.name+(p.ready?' ✓':'')).join('  |  ');$('ready').hidden=v.phase!=='wait';$('ready').textContent=v.players.find(p=>p.id===s.id)?.ready?'준비 취소':'준비 완료';$('board').hidden=!v.clues;$('reset').disabled=v.phase!=='play';if(v.clues&&!built){built=true;draw()}if(v.phase==='final'){ $('elapsed').textContent=Number.isFinite(v.elapsed)?'소요 시간: '+(v.elapsed/1000).toFixed(1)+'초':''; $('winner').textContent=v.winner==='상대방 퇴장으로 종료'?v.winner:v.winner+' 승리!';if(!$('result').open)$('result').showModal()}});s.on('win',v=>{$('elapsed').textContent=(v.elapsed/1000).toFixed(1)+'초 만에 완성'});s.on('msg',m=>$('msg').textContent=m);s.on('disconnect',()=>{leave();$('msg').textContent='연결이 끊겼습니다. 다시 입장해 주세요.'});setInterval(()=>{if(!state)return;$('status').textContent=state.phase==='wait'?'2~4명 · 전원 준비 시 시작':state.phase==='countdown'?Math.max(0,Math.ceil((state.end-Date.now())/1000))+'초 후 시작':state.phase==='play'?Math.floor((Date.now()-state.end)/1000)+'초 경과':'게임 종료'},150);
</script></html>
