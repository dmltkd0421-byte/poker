<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>무거운 13</title><style>*{box-sizing:border-box}body{background:#101416;color:#eee;font:16px system-ui;max-width:850px;margin:auto;padding:15px;text-align:center}h1,h2,a{color:#e2bd77}button,input,select{font:inherit;padding:10px;border:1px solid #8b7956;border-radius:8px;background:#232a2e;color:#eee;margin:4px}button{cursor:pointer}button:disabled{opacity:.35}button.sel,button.primary{background:#d8b475;color:#171717}section{background:#1b2226;border:1px solid #343d40;border-radius:14px;padding:14px;margin:12px 0}.players,.boards{display:flex;gap:12px}.players>div,.boards>div{flex:1;min-width:0}.active{outline:2px solid #e2bd77}.tower{display:flex;flex-direction:column-reverse;align-items:center;justify-content:flex-start;height:230px;overflow:auto}.cube{width:48px;min-height:34px;border-radius:5px;border:1px solid #ffffff70;box-shadow:inset -7px -5px 0 #0004;font:bold 22px system-ui;display:grid;place-items:center}.R{background:#a83240}.B{background:#245da7}.W{background:linear-gradient(120deg,#b34b4b,#7960b6,#248fa2)}.base{height:12px;background:#9b9c9e;border-radius:4px}.overlay{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:15px}.modal{background:#20282b;border:1px solid #b49b66;border-radius:16px;padding:20px;width:min(100%,500px);max-height:90vh;overflow:auto}[hidden]{display:none!important}.muted{color:#aeb6b8;font-size:13px}.log{text-align:left;font-size:14px}.room{display:block;width:100%}#clock{color:#e2bd77;font-size:25px}.num{min-width:42px;font-size:22px}.danger{color:#ff7d7d}body{background:#35231c;color:#fff0db;font:16px system-ui;text-align:center;max-width:760px;margin:auto;padding:20px}h1{color:#fff0db;font-size:2em;letter-spacing:normal;margin:.67em 0}a{color:#ffbf79!important}#lobby{background:#493126;border:1px solid #8f6044;border-radius:18px;padding:16px;margin:15px 0}#lobby button,#lobby input,#lobby select{font:inherit;padding:12px;border-radius:9px;border:1px solid #a87550;background:#f0b477;color:#342016;margin:5px}#lobby input:not([type=radio]){background:#fff0dc;width:100%;min-width:0}#lobby label.field{display:grid;grid-template-columns:80px minmax(0,1fr);align-items:center;text-align:left;gap:8px;margin:10px auto;max-width:480px}#lobby .room{width:95%;margin:6px auto}#lobby .round-options{display:flex;flex-wrap:wrap;gap:8px}#lobby .round-choice{display:flex;align-items:center;gap:5px;margin:0;padding:8px;border:1px solid #a87550;border-radius:9px;cursor:pointer}#lobby input[type=radio]{accent-color:#f0b477;width:18px;height:18px;margin:0}#lobby .round-choice:has(input:checked){background:#f0b477;color:#342016}#lobby .create{min-width:150px}</style><body><a href="/" onclick="leave()">← 게임 선택</a><h1>무거운 13</h1><p>심리전과 역순 패스</p><section id="lobby"><label class="field">닉네임: <input id="name" maxlength="20" placeholder="닉네임 입력"></label><div class="field" style="display:grid;grid-template-columns:80px 1fr;align-items:center;gap:8px;max-width:480px;margin:10px auto;text-align:left"><span>라운드:</span><div class="round-options"><label class="round-choice"><input type="radio" name="rounds" value="7">7라운드</label><label class="round-choice"><input type="radio" name="rounds" value="14" checked>14라운드</label></div></div><button class="primary create" onclick="create()">방 만들기</button><h3>공개 방 목록</h3><div id="rooms"></div></section><div id="game" hidden><h2 id="phase"></h2><div id="clock"></div><section class="players" id="players"></section><section class="boards" id="boards"></section><section id="order"></section><section id="hand"></section><section class="log" id="log"></section><button onclick="leave()">대기실로</button></div><p id="msg"></p><div id="overlay" class="overlay" hidden><div id="modal" class="modal"></div></div><script src="/socket.io/socket.io.js"></script><script>
const $=x=>document.getElementById(x),socket=io('/heavy'),token=sessionStorage.heavyToken||(sessionStorage.heavyToken=crypto.randomUUID());let s,n,c,review=false;const esc=x=>String(x).replace(/[&<>"']/g,z=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[z])),colors={R:'🔴 빨강',B:'🔵 파랑',W:'🌈 레인보우'};$('name').value=localStorage.mpName||'';function name(){let n=$('name').value.trim();if(!n){$('msg').textContent='닉네임을 입력하세요';return}localStorage.mpName=n;return n}function create(){let v=name();if(v)socket.emit('create',{name:v,rounds:+document.querySelector('input[name=rounds]:checked').value,token})}function leave(){socket.emit('leave');s=null;$('game').hidden=true;$('lobby').hidden=false;$('overlay').hidden=true}socket.on('connect',()=>socket.emit('resume',token));socket.on('errorMsg',m=>$('msg').textContent=m);socket.on('rooms',rs=>{$('rooms').replaceChildren();if(!rs.length)$('rooms').textContent='참가 가능한 방이 없습니다.';for(let r of rs){let b=document.createElement('button');b.className='room';b.textContent=`${r.name}의 방 · ${r.n}/3 · ${r.rounds}R`;b.onclick=()=>{let v=name();if(v)socket.emit('join',{id:r.id,name:v,token})};$('rooms').append(b)}});socket.on('state',v=>{if(!s||s.phase!==v.phase||s.round!==v.round){n=null;c=null;review=false}s=v;render()});function selectN(v){n=v;render()}function selectC(v){c=v;render()}function ready(){socket.emit('ready')}function act(pass,color){socket.emit('act',{pass,color})}function render(){if(!s)return;let me=s.players.find(p=>p.id===s.me),mine=s.turn===s.me,done=['result','final','aborted'].includes(s.phase),who=id=>esc(s.players.find(p=>p.id===id)?.name||'');$('lobby').hidden=true;$('game').hidden=false;$('phase').textContent=`${s.round||1}/${s.rounds} · `+({wait:'준비',countdown:'시작 준비',choose:'카드와 칩 선택',place:'큐브 배치',result:'라운드 결과',final:'최종 결과',aborted:'게임 중단'}[s.phase]);$('players').innerHTML=s.players.map(p=>`<div class="${p.id===s.turn?'active':''}"><b>${esc(p.name)}${p.id===s.me?' (나)':''}</b><p>벌점 ${p.score}</p><div>패스 ${'●'.repeat(p.passes)}${'○'.repeat(3-p.passes)}</div><small>${!p.online?'연결 끊김':p.ready?'준비 완료':p.done?'제출 완료':'대기'}</small>${p.pick?`<p>${p.pick.n} · ${colors[p.pick.c]}</p>`:''}</div>`).join('');$('boards').innerHTML=['R','B'].map(k=>{let sum=s.board[k].reduce((a,b)=>a+b,0);return `<div><b>${colors[k]}</b><div class="tower">${s.board[k].map(v=>`<div class="cube ${k}">${v}</div>`).join('')}</div><div class="base"></div><h2 class="${sum>=10?'danger':''}">${sum} / 13</h2></div>`}).join('');$('order').innerHTML=s.turn?`현재: <b>${who(s.turn)}</b> · 다음: ${s.queue.map(who).join(' → ')||'없음'}`:'배치 순서 대기';$('hand').innerHTML=s.phase==='wait'?`<button class="primary" onclick="ready()">${me.ready?'준비 취소':'준비 완료'}</button>`:s.phase==='choose'?`<h3>숫자 카드</h3>${s.cards.map(v=>`<button class="num ${n===v?'sel':''}" ${me.done?'disabled':''} onclick="selectN(${v})">${v}</button>`).join('')}<h3>색깔 칩</h3>${['R','B','W'].map(k=>`<button class="${c===k?'sel':''}" ${me.done||!s.chips.includes(k)?'disabled':''} onclick="selectC('${k}')">${colors[k]} × ${s.chips.filter(x=>x===k).length}</button>`).join('')}<p><button class="primary" ${me.done||n==null||!c?'disabled':''} onclick="socket.emit('pick',{n,c})">${me.done?'제출 완료':'제출하기'}</button></p>`:s.phase==='place'&&mine?`${me.pick.c==='W'?'<button onclick="act(false,\'R\')">빨강 배치</button><button onclick="act(false,\'B\')">파랑 배치</button>':'<button class="primary" onclick="act(false)">큐브 배치</button>'}<button ${!me.passes||!s.canPass?'disabled':''} onclick="act(true)">패스하기 (${me.passes})</button>`:done?'<button onclick="review=false;render()">결과 다시 보기</button>':'다른 플레이어 대기 중';$('log').innerHTML='<b>진행 기록</b><p>'+s.log.map(esc).join('<br>')+'</p><details><summary>이전 라운드</summary>'+s.history.map(h=>`<p>${h.round}R · ${h.log.map(esc).join(' / ')}</p>`).join('')+'</details>';$('overlay').hidden=!(s.phase==='countdown'||done&&!review);if(s.phase==='countdown')$('modal').innerHTML='<h2>게임 시작까지</h2><h1 id="count"></h1>';else if(done){let sorted=[...s.players].sort((a,b)=>a.score-b.score);$('modal').innerHTML=`<h2>${s.phase==='aborted'?'연결 종료로 게임 중단':s.phase==='final'?'최종 결과':'라운드 결과'}</h2>${sorted.map(p=>`<p>${esc(p.name)} · 이번 +${p.delta||0} · 누적 ${p.score}점 ${p.ready?'✓':''}</p>`).join('')}${s.phase==='final'?'<h2>우승: '+sorted.filter(p=>p.score===sorted[0].score).map(p=>esc(p.name)).join(', ')+'</h2>':''}<button onclick="review=true;render()">복기</button>${s.phase==='result'?`<button class="primary" onclick="ready()">${me.ready?'준비 취소':'다음 라운드 준비'}</button>`:'<button onclick="leave()">대기실로</button>'}`}}setInterval(()=>{let t=s?.end?Math.max(0,Math.ceil((s.end-Date.now())/1000)):'';$('clock').textContent=t===''?'':t+'초';if($('count'))$('count').textContent=t},100);
</script></body></html>
